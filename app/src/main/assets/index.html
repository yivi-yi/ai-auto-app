<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Auto</title>
<style>
body{font-family:sans-serif;margin:12px;background:#202124;color:#e8eaed}
h2{font-weight:600}
.row{display:flex;gap:8px;margin:8px 0}
button{flex:1;padding:12px;border:0;border-radius:8px;background:#3c4043;color:#e8eaed;font-size:16px}
input{flex:1;padding:10px;border-radius:8px;border:1px solid #555;background:#303134;color:#e8eaed}
label{display:block;font-size:13px;opacity:.8;margin-top:8px}
#status{font-size:14px;color:#8ab4f8}
.node{display:block;width:100%;text-align:left;margin:4px 0;padding:10px;background:#292b2e;border-radius:6px;font-size:14px;color:#e8eaed}
.node.click{color:#8ab4f8}
img{max-width:100%;border-radius:8px;margin-top:10px;display:none}
</style>
</head>
<body>
<h2>AI Auto</h2>
<div id="status">未连</div>

<div class="row">
  <button onclick="loadUi()">读取 UI 树</button>
  <button onclick="status()">状态</button>
</div>
<div id="ui"></div>

<label>点击坐标</label>
<div class="row">
  <input id="cx" placeholder="x">
  <input id="cy" placeholder="y">
  <button onclick="tap(num('cx'), num('cy'))">点击</button>
</div>

<label>输入文字</label>
<div class="row">
  <input id="itext" placeholder="输入内容">
  <button onclick="inputText()">输入</button>
</div>

<label>局域网 token（家里用可留空，留空 = 同一 WiFi 谁都能连）</label>
<div class="row">
  <input id="tok" placeholder="留空 = 不校验">
  <button onclick="saveToken()">保存</button>
</div>

<label>打开 APP（包名）</label>
<div class="row">
  <input id="pkg" placeholder="com.example.app">
  <button onclick="openApp()">打开</button>
</div>

<label>滑动</label>
<div class="row">
  <input id="x1" placeholder="x1">
  <input id="y1" placeholder="y1">
  <input id="x2" placeholder="x2">
  <input id="y2" placeholder="y2">
</div>
<div class="row">
  <button onclick="swipe()">滑动</button>
  <button onclick="act('back')">返回</button>
  <button onclick="act('home')">主页</button>
  <button onclick="shot()">截图</button>
</div>
<img id="view">

<script>
const BASE = 'http://127.0.0.1:8080';
async function post(path, body){
  const r = await fetch(BASE+path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  return r;
}
function num(id){ return parseFloat(document.getElementById(id).value); }
function setStatus(s){ document.getElementById('status').textContent = s; }

async function loadUi(){
  const r = await fetch(BASE+'/ui');
  const arr = await r.json();
  const box = document.getElementById('ui');
  box.innerHTML = '';
  if(!Array.isArray(arr)){ box.textContent = '空'; setStatus('读树失败'); return; }
  arr.forEach(n => {
    const t = n.text || '—';
    const div = document.createElement('div');
    div.className = 'node' + (n.click ? ' click' : '');
    div.textContent = t + ' (' + n.x + ',' + n.y + ')';
    if(n.click){ div.onclick = function(){ tap(n.x, n.y); }; }
    box.appendChild(div);
  });
  setStatus('已读取 '+arr.length+' 项');
}
async function tap(x, y){
  if(isNaN(x)||isNaN(y)){ setStatus('坐标无效'); return; }
  await post('/action', {type:'tap', x:x, y:y});
  setStatus('已执行');
}
async function swipe(){
  await post('/action', {type:'swipe', x1:num('x1'), y1:num('y1'), x2:num('x2'), y2:num('y2'), duration:300});
  setStatus('已执行');
}
async function act(t){
  await post('/action', {type:t});
  setStatus('已执行');
}
async function inputText(){
  const t = document.getElementById('itext').value;
  await post('/action', {type:'inputText', text:t});
  setStatus('已执行');
}
async function openApp(){
  const p = document.getElementById('pkg').value;
  await post('/action', {type:'openApp', package:p});
  setStatus('已执行');
}
async function shot(){
  await post('/capture', {});
  const r = await fetch(BASE+'/screenshot');
  const b = await r.blob();
  const url = URL.createObjectURL(b);
  const img = document.getElementById('view');
  img.src = url; img.style.display = 'block';
  setStatus('已执行');
}
async function status(){
  const r = await fetch(BASE+'/status');
  const j = await r.json();
  setStatus('无障碍' + (j.accessibility === 'on' ? '开' : '关') +
    ' · 截图 ' + (j.screenshot || 'none') +
    ' · :' + j.port + (j.error ? ' · ' + j.error : ''));
  if (j.token_required) document.getElementById('tok').placeholder = '已设置（想清空就删掉再保存）';
}
async function saveToken(){
  const t = document.getElementById('tok').value.trim();
  const r = await post('/set_token', {token: t});
  setStatus(r.ok ? (t ? '已设置 token' : '已清空 token') : '设置失败');
}
</script>
</body>
</html>
